<!doctype html>
<html lang="zh-CN">
<head>

<title>阆中AI寻宝 · 首页</title>

<body class="home">
<div class="skeleton-overlay" id="skeleton">
  <div class="skeleton-nav">
    <div class="skeleton-nav-left">
      <div class="skeleton-nav-dot"></div>
      <div class="skeleton-nav-title"></div>
    </div>
    <div class="skeleton-nav-links">
      <div class="skeleton-nav-link"></div>
      <div class="skeleton-nav-link"></div>
      <div class="skeleton-nav-link"></div>
      <div class="skeleton-nav-link"></div>
      <div class="skeleton-nav-link"></div>
    </div>
  </div>
  <div class="skeleton-content" style="padding:0;">
    <div style="width:100%; height:calc(100vh - 70px); position:relative;">
      <div style="position:absolute; top:60px; left:60px;">
        <div class="skeleton-title" style="width:200px; margin-bottom:20px;"></div>
        <div class="skeleton-text" style="width:150px;"></div>
      </div>
      <div style="position:absolute; bottom:60px; left:50%; transform:translateX(-50%); display:flex; gap:30px;">
        <div class="skeleton-card" style="width:200px; height:120px;"></div>
        <div class="skeleton-card" style="width:200px; height:120px;"></div>
        <div class="skeleton-card" style="width:200px; height:120px;"></div>
      </div>
    </div>
  </div>
</div>
<div class="hero">
  <div class="img-slot slot-hero">
    <img src="images/cover.jpg" alt="阆中古城全景">
  </div>
  <div class="hero-mask"></div>
  <div class="hero-top">
    <h1>阆中AI寻宝</h1>
    <div class="hero-nav-line"></div>
    <div class="hero-nav">
      <a href="index.html" class="on">首页</a>
      <a href="map.html">寻宝路线</a>
      <a href="detail.html">景点详情</a>
      <a href="food.html">特色美食</a>
      <a href="chat.html">AI导游</a>
    </div>
  </div>
  <div class="hero-bottom">
    <div class="flip-cards">
      <a href="map.html" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <i class="iconoir-map-pin"></i>
            <span>开始寻宝</span>
          </div>
          <div class="flip-card-back">
            <p>按路线打卡5个景点，解锁阆中古城的风水密码</p>
          </div>
        </div>
      </a>
      <a href="food.html" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <i class="iconoir-cutlery"></i>
            <span>品尝美食</span>
          </div>
          <div class="flip-card-back">
            <p>保宁醋、张飞牛肉、蒸馍…舌尖上的古城味道</p>
          </div>
        </div>
      </a>
      <a href="chat.html" class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <i class="iconoir-chat-bubble"></i>
            <span>AI导游</span>
          </div>
          <div class="flip-card-back">
            <p>有问题随时问，小阆带你玩转阆中古城</p>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
<script src="js/main.js"></script>
