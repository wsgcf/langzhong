<script>

(function () {
  var stage = document.querySelector(".food-stage");
  var video = stage.querySelector("video");
  var img = stage.querySelector("img");
  function start() {
    img.style.opacity = "0";
    video.style.opacity = "1";
    video.play().catch(function(){});
  }
  function stop() {
    video.pause();
    img.style.opacity = "1";
    video.style.opacity = "0";
  }
  stage.addEventListener("mouseenter", start);
  stage.addEventListener("mouseleave", stop);
})();

(function () {
  var cards = document.querySelectorAll(".food-card");
  var total = cards.length;
  var currentIndex = 0;
  
  var foodData = [
    { title: "张飞牛肉", desc: "外黑内红，咸香干香，阆中第一名吃" },
    { title: "保宁醋", desc: "药曲酿造，醇厚回甘，四大名醋之一" },
    { title: "保宁蒸馍", desc: "松软香甜，淡淡桂花，百年老字号" },
    { title: "怪味胡豆", desc: "麻辣酥脆，越嚼越香，古城网红零食" },
    { title: "芝麻饼", desc: "满口香酥，芝麻浓郁，烤出来的老味道" },
    { title: "保宁醋", desc: "药曲酿造，醇厚回甘，四大名醋之一" },
    { title: "传统糕点", desc: "古法制作，甜而不腻，阆中老味道" },
    { title: "张飞牛肉", desc: "外黑内红，咸香干香，阆中第一名吃" }
  ];
  var foodTitle = document.querySelector("#foodTitle");
  var foodDesc = document.querySelector("#foodDesc");
  function updateCarousel() {
    cards.forEach(function (card, i) {
      
      var diff = i - currentIndex;
      if (diff > total / 2) diff -= total;
      if (diff < -total / 2) diff += total;
      var absDiff = Math.abs(diff);
      
      var translateX = diff * 150;
      var scale = 1 - absDiff * 0.08;
      var rotateY = -diff * 10;
      var opacity = absDiff > 3 ? 0 : 1 - absDiff * 0.15;
      var zIndex = 10 - absDiff;
      card.style.transform = "translateX(" + translateX + "px) scale(" + scale + ") rotateY(" + rotateY + "deg)";
      card.style.opacity = opacity;
      card.style.zIndex = zIndex;
      
      if (diff === 0) {
        card.style.borderColor = "rgba(168,139,250,.4)";
        card.style.boxShadow = "inset 0 1px 0 rgba(255,255,255,.08), 0 24px 48px rgba(0,0,0,.45), 0 0 0 1px rgba(168,139,250,.2), 0 12px 32px rgba(139,92,246,.15)";
      } else {
        card.style.borderColor = "rgba(168,139,250,.15)";
        card.style.boxShadow = "inset 0 1px 0 rgba(255,255,255,.06), 0 12px 32px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.15)";
      }
    });
    
    foodTitle.textContent = foodData[currentIndex].title;
    foodDesc.textContent = foodData[currentIndex].desc;
  }
  
  updateCarousel();
  
  setInterval(function () {
    currentIndex++;
    if (currentIndex >= total) currentIndex = 0;
    updateCarousel();
  }, 3000);
  
  cards.forEach(function (card, i) {
    card.addEventListener("click", function () {
      currentIndex = i;
      updateCarousel();
    });
  });
})();
</script>
